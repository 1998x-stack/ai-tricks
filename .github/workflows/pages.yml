name: Review and publish Chinese handbook
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            site/requirements.txt
            site/browser-requirements.txt
      - name: Install offline test and site dependencies
        run: |
          python -m pip install -r site/requirements.txt -r site/browser-requirements.txt numpy matplotlib
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m playwright install --with-deps chromium
      - name: Check protocol generation and real tensor semantics
        env:
          HF_HUB_OFFLINE: '1'
          HF_DATASETS_OFFLINE: '1'
        run: |
          python -m experiments.tools.build_catalog
          python -m experiments.tools.audit
          git diff --exit-code -- experiments
          python -m unittest discover -s tests -v
      - name: Build and inspect project-path site
        run: |
          python tools/build_site.py --output .site-preview/ai-tricks --base-url /ai-tricks
          python site/browser_checks.py --root .site-preview
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: site-test-results/
          retention-days: 7
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Package Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site-preview/ai-tricks

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
